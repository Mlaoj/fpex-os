<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>FPEX OS</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="boot"><div class="boot-logo">FPEX</div><div class="boot-line"></div><p class="boot-sub">FPEX OS ALPHA 0.1 · web prototype</p></div>
<div id="bg"><div class="bg-layer"></div><div class="bg-layer"></div><div id="shade"></div></div>
<header id="top">
  <div class="brand">FPEX</div>
  <nav id="nav" aria-label="Main">
    <button data-f data-nav="home">Home</button>
    <button data-f data-nav="games">Games</button>
    <button data-f data-nav="store">Store</button>
    <button data-f data-nav="steam">Steam</button>
    <button data-f data-nav="ai">FPEX AI</button>
    <button data-f data-nav="friends">Friends</button>
    <button data-f data-nav="settings">Settings</button>
  </nav>
  <div class="right">
    <span class="sys" id="net" title="Network status"></span>
    <span class="sys" id="stor" title="Browser storage in use"></span>
    <button data-f class="pill" data-act="search">Search</button>
    <button data-f class="pill" data-act="notes">Alerts</button>
    <button data-f class="pill" data-act="profile" id="pname">Player</button>
    <time id="clock"></time>
  </div>
</header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
